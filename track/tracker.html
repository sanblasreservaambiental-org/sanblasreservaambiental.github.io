<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Redirecting...</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BWQFXFFCRZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

    gtag("js", new Date());

    gtag("config", "G-BWQFXFFCRZ", {
      transport_type: "beacon"
    });
  </script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #555;
      background: #fff;
    }
  </style>
</head>

<body>
  <p>Redirecting...</p>

  <script>
    const params = new URLSearchParams(window.location.search);

    const lang = (params.get("lang") || "es").toLowerCase();
    const campaign = params.get("campaign") || "summer2026";
    const variant = params.get("variant") || "default";
    const guide = params.get("guide") || "unknown";
    const hotel = params.get("hotel") || "barcelo_tenerife";
    const source = params.get("source") || "inhouse";
    const medium = params.get("medium") || "summeredition";

    const destination = new URL(
      lang === "en"
        ? "https://www.barcelo.com/guia-turismo/en/spain/tenerife/experiences/1121/"
        : "https://www.barcelo.com/guia-turismo/es/espana/tenerife/actividades/1121/"
    );

    const clickId =
      window.crypto && crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now() + "_" + Math.random().toString(36).substring(2);

    destination.searchParams.set("utm_source", source);
    destination.searchParams.set("utm_medium", medium);
    destination.searchParams.set("utm_campaign", campaign);
    destination.searchParams.set("utm_content", variant);
    destination.searchParams.set("click_id", clickId);

    const redirect = () => {
      window.location.replace(destination.toString());
    };

    gtag("event", "reservation_redirect", {
      campaign: campaign,
      variant: variant,
      guide: guide,
      hotel: hotel,
      language: lang,
      source: source,
      medium: medium,
      click_id: clickId,
      destination_url: destination.toString(),
      page_location: window.location.href,
      transport_type: "beacon",
      event_callback: redirect
    });

    setTimeout(redirect, 250);
  </script>
</body>
</html>
